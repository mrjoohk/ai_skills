<!DOCTYPE html>
<!--
  Archetype: split-pane + inspector
  Use for: simulation log playback, object inspection, scene analysis — anything
  where a dominant canvas is on the left and clicking objects reveals their
  properties on the right.

  How to customize this template:
    1. Replace the sample scene (SAMPLE_OBJECTS) with your real scene description.
    2. Point loadFrame(t) at your log/replay source.
    3. Extend the inspector fields in the <dl id="inspector"> block as needed
       for your domain (e.g. velocity, sensor readings, actor class).
    4. Swap {{PROJECT_NAME}} in the title bar.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{PROJECT_NAME}} — Playback</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --bg: #0f1216;
    --bg-panel: #171b22;
    --bg-hover: #1e242d;
    --border: #252b35;
    --fg: #e6e8eb;
    --fg-dim: #8b95a3;
    --accent: #5aa7ff;
    --ok: #5fd68b;
    --warn: #ffc857;
    --err: #ff6b6b;
    --radius: 6px;
    --pad: 12px;
    --inspector-w: 320px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: grid;
    grid-template-columns: 1fr var(--inspector-w);
    grid-template-rows: 44px 1fr 60px;
    grid-template-areas: "header header" "canvas inspector" "playback inspector";
  }
  header {
    grid-area: header;
    padding: 0 var(--pad);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }
  header .title {
    font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 0 3px rgba(95,214,139,.15);
  }
  header .layer-toggles { display: flex; gap: 8px; color: var(--fg-dim); font-size: 12px; }
  header .layer-toggles label { cursor: pointer; user-select: none; }
  #canvas-wrap {
    grid-area: canvas;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #1a2030 0%, #0a0d12 100%);
  }
  #canvas { display: block; width: 100%; height: 100%; }
  #canvas-hint {
    position: absolute; bottom: 8px; left: 8px;
    color: var(--fg-dim); font-size: 11px;
    background: rgba(15,18,22,0.7); padding: 4px 8px; border-radius: var(--radius);
    pointer-events: none;
  }
  #playback {
    grid-area: playback;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    padding: 0 var(--pad);
    display: flex; align-items: center; gap: 12px;
  }
  #playback button {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font: inherit;
  }
  #playback button:hover { background: var(--bg-hover); }
  #playback input[type=range] { flex: 1; }
  #playback .time { color: var(--fg-dim); font-family: ui-monospace, monospace; font-size: 12px; min-width: 80px; }
  aside#inspector-panel {
    grid-area: inspector;
    border-left: 1px solid var(--border);
    background: var(--bg-panel);
    padding: var(--pad);
    overflow-y: auto;
  }
  aside h3 {
    margin: 0 0 8px 0; font-size: 12px; font-weight: 600;
    color: var(--fg-dim); text-transform: uppercase; letter-spacing: .5px;
  }
  .selected-name { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--accent); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 12px; margin-bottom: 16px; }
  .kv dt { color: var(--fg-dim); }
  .kv dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
  .empty-inspector { color: var(--fg-dim); padding: 20px 0; text-align: center; font-size: 12px; }
  pre.event-log {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px; margin: 0; max-height: 200px; overflow: auto;
    font: 11px/1.5 ui-monospace, monospace;
  }
</style>
</head>
<body>

<header>
  <div class="title"><span class="dot"></span>{{PROJECT_NAME}}</div>
  <div class="layer-toggles" id="layers">
    <label><input type="checkbox" checked data-layer="vehicles"/> vehicles</label>
    <label><input type="checkbox" checked data-layer="pedestrians"/> pedestrians</label>
    <label><input type="checkbox" checked data-layer="sensors"/> sensors</label>
  </div>
</header>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="canvas-hint">drag to orbit · scroll to zoom · click object to inspect</div>
</div>

<div id="playback">
  <button id="playBtn">▶</button>
  <span class="time" id="timeLabel">0.00 / 0.00 s</span>
  <input id="timeSlider" type="range" min="0" max="100" step="0.1" value="0"/>
  <select id="speedSel">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
  </select>
</div>

<aside id="inspector-panel">
  <h3>Inspector</h3>
  <div id="inspector">
    <div class="empty-inspector">Click an object in the scene to inspect.</div>
  </div>
</aside>

<script>
/* ---------- SAMPLE SCENE — replace with your real data ----------
   TODO: swap SAMPLE_OBJECTS for your actual scene description, or load it
   asynchronously. Each object needs:
     { id, name, type, layer, position:[x,y,z], size:[w,h,d]?, color, meta:{...} }
   Timeline info:
     SAMPLE_DURATION_S: total playback duration in seconds
     loadFrame(t): called each frame; receives time in seconds — use it to
                   mutate object positions from your real log source.
   ------------------------------------------------------------------ */
const SAMPLE_DURATION_S = 10;

const SAMPLE_OBJECTS = [
  { id: "v1", name: "vehicle-01", type: "vehicle", layer: "vehicles",
    position: [0,0.5,0], size: [2,1,4], color: 0x5aa7ff,
    meta: { class: "car", speed_mps: 12.3, heading_deg: 45, driver: "agent-A" } },
  { id: "v2", name: "vehicle-02", type: "vehicle", layer: "vehicles",
    position: [6,0.5,-4], size: [2,1,4], color: 0xff7a7a,
    meta: { class: "truck", speed_mps: 8.0, heading_deg: 10, driver: "agent-B" } },
  { id: "p1", name: "pedestrian-01", type: "pedestrian", layer: "pedestrians",
    position: [-3,0.9,2], size: [0.6,1.8,0.6], color: 0xffc857,
    meta: { class: "adult", speed_mps: 1.2, intent: "crossing" } },
  { id: "s1", name: "lidar-front", type: "sensor", layer: "sensors",
    position: [0,1.5,1.8], size: [0.3,0.3,0.3], color: 0x5fd68b,
    meta: { class: "lidar", range_m: 80, hz: 20 } },
];

// Per-frame mutation — replace with your log-replay logic.
function loadFrame(t) {
  // cheap demo animation: vehicle-01 drives forward, pedestrian crosses
  const v1 = SAMPLE_OBJECTS.find(o => o.id==="v1");
  const p1 = SAMPLE_OBJECTS.find(o => o.id==="p1");
  if (v1) v1.position[2] = -5 + t * 1.5;
  if (p1) p1.position[0] = -3 + t * 0.4;
}

/* ---------- Three.js scene ---------- */
const canvas = document.getElementById("canvas");
const wrap = document.getElementById("canvas-wrap");

const scene = new THREE.Scene();
scene.background = null;
scene.fog = new THREE.Fog(0x0a0d12, 30, 120);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
camera.position.set(15, 12, 15);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
resize(); window.addEventListener("resize", resize);

// Lights
scene.add(new THREE.AmbientLight(0x888888, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(20, 30, 10);
scene.add(dir);

// Ground plane + grid
const grid = new THREE.GridHelper(60, 30, 0x333a44, 0x1e242d);
scene.add(grid);

// Object meshes
const meshes = {}; // id -> { mesh, baseColor, layer }
for (const o of SAMPLE_OBJECTS) {
  const [w,h,d] = o.size || [1,1,1];
  const geo = new THREE.BoxGeometry(w,h,d);
  const mat = new THREE.MeshStandardMaterial({ color: o.color, roughness: 0.6 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.id = o.id;
  mesh.position.set(...o.position);
  scene.add(mesh);
  meshes[o.id] = { mesh, baseColor: o.color, layer: o.layer };
}

// Highlight the selected object by emissive
let selectedId = null;
function setSelected(id) {
  for (const k in meshes) {
    const m = meshes[k].mesh.material;
    m.emissive = new THREE.Color(k === id ? 0x5aa7ff : 0x000000);
    m.emissiveIntensity = k === id ? 0.5 : 0;
  }
  selectedId = id;
  renderInspector();
}

/* ---------- Minimal orbit controls (no extra dependency) ---------- */
let isDown = false, lastX = 0, lastY = 0;
let yaw = Math.PI*0.25, pitch = Math.PI*0.3, dist = 24;
function applyCam() {
  camera.position.x = Math.cos(yaw)*Math.cos(pitch)*dist;
  camera.position.y = Math.sin(pitch)*dist;
  camera.position.z = Math.sin(yaw)*Math.cos(pitch)*dist;
  camera.lookAt(0,0,0);
}
applyCam();
canvas.addEventListener("mousedown", e => { isDown = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("mouseup", () => isDown = false);
window.addEventListener("mousemove", e => {
  if (!isDown) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  yaw -= dx*0.005;
  pitch = Math.max(0.05, Math.min(Math.PI/2-0.05, pitch - dy*0.005));
  lastX = e.clientX; lastY = e.clientY;
  applyCam();
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  dist = Math.max(5, Math.min(100, dist * (1 + e.deltaY*0.001)));
  applyCam();
}, { passive: false });

/* ---------- Picking (click → select) ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
canvas.addEventListener("click", e => {
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left)/rect.width)*2 - 1;
  ndc.y = -((e.clientY - rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(Object.values(meshes).map(m => m.mesh));
  if (hits.length > 0) setSelected(hits[0].object.userData.id);
  else setSelected(null);
});

/* ---------- Layer toggles ---------- */
document.getElementById("layers").addEventListener("change", e => {
  const layer = e.target.dataset.layer;
  const on = e.target.checked;
  for (const k in meshes) {
    if (meshes[k].layer === layer) meshes[k].mesh.visible = on;
  }
});

/* ---------- Inspector render ---------- */
function renderInspector() {
  const el = document.getElementById("inspector");
  if (!selectedId) {
    el.innerHTML = `<div class="empty-inspector">Click an object in the scene to inspect.</div>`;
    return;
  }
  const o = SAMPLE_OBJECTS.find(x => x.id === selectedId);
  if (!o) return;
  const kvs = [
    ["id", o.id], ["type", o.type], ["layer", o.layer],
    ["position", `[${o.position.map(n => n.toFixed(2)).join(", ")}]`]
  ];
  for (const [k,v] of Object.entries(o.meta || {})) kvs.push([k, v]);
  el.innerHTML = `
    <div class="selected-name">${o.name}</div>
    <dl class="kv">
      ${kvs.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}
    </dl>
    <h3>Events</h3>
    <pre class="event-log">t=${currentT.toFixed(2)}s · snapshot captured
(TODO: wire this to your per-object event stream)</pre>
  `;
}

/* ---------- Playback ---------- */
const playBtn = document.getElementById("playBtn");
const timeSlider = document.getElementById("timeSlider");
const timeLabel = document.getElementById("timeLabel");
const speedSel = document.getElementById("speedSel");
timeSlider.max = SAMPLE_DURATION_S;

let playing = false, currentT = 0, lastTick = 0;
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "⏸" : "▶"; lastTick = performance.now(); };
timeSlider.oninput = () => { currentT = parseFloat(timeSlider.value); update(0); };

function update(dtMs) {
  if (playing) {
    currentT += (dtMs/1000) * parseFloat(speedSel.value);
    if (currentT >= SAMPLE_DURATION_S) { currentT = 0; }
    timeSlider.value = currentT;
  }
  timeLabel.textContent = `${currentT.toFixed(2)} / ${SAMPLE_DURATION_S.toFixed(2)} s`;
  loadFrame(currentT);
  // Apply updated positions to meshes
  for (const o of SAMPLE_OBJECTS) {
    if (meshes[o.id]) meshes[o.id].mesh.position.set(...o.position);
  }
  if (selectedId) renderInspector();
}

function loop(now) {
  const dtMs = lastTick ? (now - lastTick) : 0;
  lastTick = now;
  update(dtMs);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
